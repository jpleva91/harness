[package]
name = "proto-py"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
proto-core = { path = "../core" }
pyo3 = "0.30"
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
futures = "0.3"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
serde_json = "1"
