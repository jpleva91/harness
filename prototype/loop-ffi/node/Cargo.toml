[package]
name = "proto-node"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
proto-core = { path = "../core" }
napi = { version = "3", features = ["tokio_rt", "napi8"] }
napi-derive = "3"
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
